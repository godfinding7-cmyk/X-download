<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>X Video Downloader</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      width: 92%;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 18px 0;
    }

    .logo {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
    }

    .hero {
      padding: 60px 0;
      text-align: center;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    .subtitle {
      color: #666;
      font-size: 17px;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .download-box {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    input {
      width: 100%;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #333;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 16px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      font-size: 15px;
      font-weight: bold;
      word-break: break-word;
    }

    .info {
      margin-top: 45px;
      background: white;
      border-radius: 12px;
      padding: 25px;
      text-align: left;
    }

    .info h2 {
      margin-bottom: 15px;
    }

    .info p {
      color: #555;
      line-height: 1.7;
      margin-bottom: 10px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 30px;
      }

      .hero {
        padding: 40px 0;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    X Video Downloader
  </div>
</header>

<section class="hero">

  <div class="container">

    <h1>Download X Videos</h1>

    <p class="subtitle">
      Paste a public X/Twitter post link below and download the video.
    </p>

    <div class="download-box">

      <form id="downloadForm">

        <input
          type="url"
          id="videoUrl"
          name="url"
          placeholder="Paste X post URL here..."
          required
        >

        <button type="submit" id="downloadButton">
          Download Video
        </button>

      </form>

      <div id="status"></div>

    </div>

    <div class="info">

      <h2>How to download</h2>

      <p>1. Open a public post on X containing a video.</p>

      <p>2. Copy the post link.</p>

      <p>3. Paste the link into the box above.</p>

      <p>4. Tap Download Video.</p>

    </div>

  </div>

</section>

<footer>
  X Video Downloader
</footer>


<script>

const form = document.getElementById("downloadForm");
const button = document.getElementById("downloadButton");
const statusBox = document.getElementById("status");


form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const videoUrl =
    document.getElementById("videoUrl").value.trim();


  if (!videoUrl) {

    statusBox.innerText =
      "Please paste an X video URL.";

    return;
  }


  button.disabled = true;
  button.innerText = "Processing...";

  statusBox.innerText =
    "Preparing video...";


  try {

    /*
       IMPORTANT:
       Sending data as normal HTML form data.

       Flask backend can read this using:

       request.form.get("url")
    */

    const formData = new URLSearchParams();

    formData.append("url", videoUrl);


    const response = await fetch("/download", {

      method: "POST",

      headers: {
        "Content-Type":
          "application/x-www-form-urlencoded"
      },

      body: formData.toString()

    });


    if (!response.ok) {

      let errorMessage =
        "Unable to download this video.";

      try {

        const data = await response.json();

        errorMessage =
          data.error ||
          data.message ||
          errorMessage;

      } catch (e) {

        try {

          const text =
            await response.text();

          if (text) {
            errorMessage = text;
          }

        } catch (e) {}

      }

      throw new Error(errorMessage);

    }


    const contentType =
      response.headers.get("content-type") || "";


    /*
      CASE 1:
      Backend returns JSON download URL
    */

    if (
      contentType.includes(
        "application/json"
      )
    ) {

      const data =
        await response.json();


      const downloadUrl =
        data.download_url ||
        data.url ||
        data.video_url;


      if (downloadUrl) {

        statusBox.innerText =
          "Download starting...";

        window.location.href =
          downloadUrl;

        return;

      }


      if (data.error) {

        throw new Error(
          data.error
        );

      }


      throw new Error(
        "Video download link not found."
      );

    }


    /*
      CASE 2:
      Backend directly sends MP4/file
    */

    const blob =
      await response.blob();


    if (!blob.size) {

      throw new Error(
        "Empty video file received."
      );

    }


    const fileUrl =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");


    link.href =
      fileUrl;


    link.download =
      "x-video.mp4";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    setTimeout(function() {

      URL.revokeObjectURL(
        fileUrl
      );

    }, 5000);


    statusBox.innerText =
      "Download started.";


  } catch (error) {

    console.error(error);

    statusBox.innerText =
      error.message ||
      "Unable to download this video.";

  }


  button.disabled = false;

  button.innerText =
    "Download Video";

});

</script>

</body>
</html>
